<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WEB 330 – Week 8</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="src/script.js" defer></script>
</head>
<body>
  <header>Week 8: Forensic Reconstruction</header>

  <section>
    <h1>Movie Search</h1>

    <form id="movie-form">
      <input type="text" id="title-input" placeholder="Enter movie title">
      <button type="submit">Search</button><br />
      <em id="movies">ex: Inception, The Matrix, Interstellar</em>
    </form>

    <div id="movie-info">
      <h2 id="movie-title"></h2>
      <p id="movie-director"></p>
      <p id="movie-year"></p>
      <p id="movie-synopsis"></p>
    </div>

    <p id="error-message"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
